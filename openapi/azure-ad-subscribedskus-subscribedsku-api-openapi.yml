paths:
  /subscribedSkus:
    get:
      tags:
      - subscribedSkus.subscribedSku
      summary: List subscribedSkus
      description: Get the list of commercial subscriptions that an organization has acquired. For the mapping of license names as displayed on the Microsoft Entra admin center or the Microsoft 365 admin center against their Microsoft Graph skuId and skuPartNumber properties, see Product names and service plan identifiers for licensing.
      externalDocs:
        description: Find more info here
        url: https://learn.microsoft.com/graph/api/subscribedsku-list?view=graph-rest-1.0
      operationId: subscribedSku_ListSubscribedSku
      parameters:
      - $ref: '#/components/parameters/top'
      - $ref: '#/components/parameters/skip'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/count'
      - name: $orderby
        in: query
        description: Order items by property values
        style: form
        explode: false
        schema:
          uniqueItems: true
          type: array
          items:
            type: string
      - name: $select
        in: query
        description: Select properties to be returned
        style: form
        explode: false
        schema:
          uniqueItems: true
          type: array
          items:
            type: string
      - name: $expand
        in: query
        description: Expand related entities
        style: form
        explode: false
        schema:
          uniqueItems: true
          type: array
          items:
            type: string
      responses:
        2XX:
          $ref: '#/components/responses/microsoft.graph.subscribedSkuCollectionResponse'
        default:
          $ref: '#/components/responses/error'
      x-ms-pageable:
        nextLinkName: '@odata.nextLink'
        operationName: listMore
      x-ms-docs-operation-type: operation
    post:
      tags:
      - subscribedSkus.subscribedSku
      summary: Add new entity to subscribedSkus
      operationId: subscribedSku_CreateSubscribedSku
      requestBody:
        description: New entity
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/microsoft.graph.subscribedSku'
        required: true
      responses:
        2XX:
          description: Created entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/microsoft.graph.subscribedSku'
        default:
          $ref: '#/components/responses/error'
      x-ms-docs-operation-type: operation
  /subscribedSkus/{subscribedSku-id}:
    get:
      tags:
      - subscribedSkus.subscribedSku
      summary: Get subscribedSku
      description: Get a specific commercial subscription that an organization has acquired.
      externalDocs:
        description: Find more info here
