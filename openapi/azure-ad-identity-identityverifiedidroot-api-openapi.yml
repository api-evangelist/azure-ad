      operationId: identity.verifiedId_GetProfile
      parameters:
      - name: verifiedIdProfile-id
        in: path
        description: The unique identifier of verifiedIdProfile
        required: true
        style: simple
        schema:
          type: string
        x-ms-docs-key-type: verifiedIdProfile
      - name: $select
        in: query
        description: Select properties to be returned
        style: form
        explode: false
        schema:
          uniqueItems: true
          type: array
          items:
            type: string
      - name: $expand
        in: query
        description: Expand related entities
        style: form
        explode: false
        schema:
          uniqueItems: true
          type: array
          items:
            type: string
      responses:
