          application/json:
            schema:
              type: object
              properties:
                verifiedPublisherId:
                  type: string
              additionalProperties:
                type: object
        required: true
      responses:
        2XX:
          description: Success
        default:
          $ref: '#/components/responses/error'
      x-ms-docs-operation-type: action
  /applications/{application-id}/microsoft.graph.unsetVerifiedPublisher:
    post:
      tags:
      - applications.application.Actions
      summary: Invoke action unsetVerifiedPublisher
      description: Unset the verifiedPublisher previously set on an agentIdentityBlueprint, removing all verified publisher properties. For more information, see Publisher verification.
      externalDocs:
        description: Find more info here
        url: https://learn.microsoft.com/graph/api/agentidentityblueprint-unsetverifiedpublisher?view=graph-rest-1.0
      operationId: application_unsetVerifiedPublisher
