                  type: object
        default:
          $ref: '#/components/responses/error'
      x-ms-docs-operation-type: action
      x-ms-pageable:
        nextLinkName: '@odata.nextLink'
        operationName: listMore
  /applications/{application-id}/microsoft.graph.removeKey:
    post:
      tags:
      - applications.application.Actions
      summary: Invoke action removeKey
      description: Remove a key credential from an agentIdentityBlueprint. This method along with addKey can be used to automate rolling its expiring keys.
      externalDocs:
        description: Find more info here
        url: https://learn.microsoft.com/graph/api/agentidentityblueprint-removekey?view=graph-rest-1.0
      operationId: application_removeKey
      parameters:
      - name: application-id
        in: path
        description: The unique identifier of application
        required: true
        style: simple
        schema:
          type: string
        x-ms-docs-key-type: application
      requestBody:
        description: Action parameters
        content:
          application/json:
            schema:
              type: object
              properties:
                keyId:
                  pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                  type: string
                  format: uuid
                proof:
                  type: string
              additionalProperties:
                type: object
        required: true
      responses:
        2XX:
          description: Success
        default:
          $ref: '#/components/responses/error'
      x-ms-docs-operation-type: action
  /applications/{application-id}/microsoft.graph.removePassword:
    post:
      tags:
      - applications.application.Actions
      summary: Invoke action removePassword
      description: Remove a password from an application.
      externalDocs:
        description: Find more info here
