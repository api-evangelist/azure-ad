          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/microsoft.graph.localeInfo'
                  '@odata.nextLink':
                    type:
                    - string
                    - 'null'
                additionalProperties:
