  /users/{user-id}/outlook/microsoft.graph.supportedLanguages():
    get:
      tags:
      - users.outlookUser
      summary: Invoke function supportedLanguages
      description: 'Get the list of locales and languages that are supported for the user, as configured on the user''s mailbox server. When setting up an Outlook client, the user selects the preferred language from this supported list. You can subsequently get the preferred language by

        getting the user''s mailbox settings.'
      externalDocs:
        description: Find more info here
        url: https://learn.microsoft.com/graph/api/outlookuser-supportedlanguages?view=graph-rest-1.0
      operationId: user.outlook_supportedLanguage
      parameters:
      - name: user-id
        in: path
        description: The unique identifier of user
        required: true
        style: simple
        schema:
          type: string
        x-ms-docs-key-type: user
      - $ref: '#/components/parameters/top'
      - $ref: '#/components/parameters/skip'
      - $ref: '#/components/parameters/search'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/count'
