components:
  responses:
    error:
      description: error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/microsoft.graph.ODataErrors.ODataError'
    microsoft.graph.outlookCategoryCollectionResponse:
      description: Retrieved collection
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/microsoft.graph.outlookCategoryCollectionResponse'
    ODataCountResponse:
      description: The count of the resource
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/ODataCountResponse'
  schemas:
    microsoft.graph.ODataErrors.MainError:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
          x-ms-primary-error-message: true
        target:
          type:
          - string
          - 'null'
        details:
          type: array
          items:
            $ref: '#/components/schemas/microsoft.graph.ODataErrors.ErrorDetails'
        innerError:
          $ref: '#/components/schemas/microsoft.graph.ODataErrors.InnerError'
      additionalProperties:
        type: object
    ODataCountResponse:
      type: integer
      format: int32
    microsoft.graph.outlookCategoryCollectionResponse:
      title: Collection of outlookCategory
      type: object
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/microsoft.graph.outlookCategory'
        '@odata.nextLink':
          type:
          - string
          - 'null'
      additionalProperties:
        type: object
    microsoft.graph.outlookCategory:
      allOf:
      - $ref: '#/components/schemas/microsoft.graph.entity'
      - title: outlookCategory
        type: object
        properties:
          color:
            $ref: '#/components/schemas/microsoft.graph.categoryColor'
          displayName:
            type:
            - string
            - 'null'
            description: A unique name that identifies a category in the user's mailbox. After a category is created, the name cannot be changed. Read-only.
        additionalProperties:
          type: object
    microsoft.graph.ODataErrors.InnerError:
      type: object
      additionalProperties:
        type: object
      description: The structure of this object is service-specific
    microsoft.graph.ODataErrors.ODataError:
      required:
      - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/microsoft.graph.ODataErrors.MainError'
      additionalProperties:
        type: object
    microsoft.graph.ODataErrors.ErrorDetails:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        target:
          type:
          - string
          - 'null'
      additionalProperties:
        type: object
    microsoft.graph.timeZoneStandard:
      title: timeZoneStandard
      enum:
      - windows
      - iana
      type: string
    microsoft.graph.entity:
      title: entity
      type: object
      properties:
        id:
          type: string
          description: The unique identifier for an entity. Read-only.
      additionalProperties:
        type: object
    microsoft.graph.outlookUser:
      allOf:
      - $ref: '#/components/schemas/microsoft.graph.entity'
      - title: outlookUser
        type: object
        properties:
          masterCategories:
            type: array
            items:
              $ref: '#/components/schemas/microsoft.graph.outlookCategory'
            description: A list of categories defined for the user.
            x-ms-navigationProperty: true
        additionalProperties:
          type: object
    microsoft.graph.localeInfo:
      title: localeInfo
      type: object
      properties:
        displayName:
          type:
          - string
          - 'null'
          description: A name representing the user's locale in natural language, for example, 'English (United States)'.
        locale:
          type:
          - string
          - 'null'
          description: A locale representation for the user, which includes the user's preferred language and country/region. For example, 'en-us'. The language component follows 2-letter codes as defined in ISO 639-1, and the country component follows 2-letter codes as defined in ISO 3166-1 alpha-2.
      additionalProperties:
        type: object
    microsoft.graph.categoryColor:
      title: categoryColor
      enum:
      - none
      - preset0
      - preset1
      - preset2
      - preset3
      - preset4
      - preset5
      - preset6
      - preset7
      - preset8
      - preset9
      - preset10
      - preset11
      - preset12
      - preset13
      - preset14
      - preset15
      - preset16
      - preset17
      - preset18
      - preset19
      - preset20
      - preset21
      - preset22
      - preset23
      - preset24
      type: string
    microsoft.graph.timeZoneInformation:
      title: timeZoneInformation
      type: object
      properties:
        alias:
          type:
          - string
          - 'null'
          description: An identifier for the time zone.
        displayName:
          type:
          - string
          - 'null'
          description: A display string that represents the time zone.
      additionalProperties:
        type: object
