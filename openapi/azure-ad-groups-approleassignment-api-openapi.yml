    patch:
      tags:
      - groups.appRoleAssignment
      summary: Update the navigation property appRoleAssignments in groups
      operationId: group_UpdateAppRoleAssignment
      parameters:
      - name: group-id
        in: path
        description: The unique identifier of group
        required: true
        style: simple
        schema:
          type: string
        x-ms-docs-key-type: group
      - name: appRoleAssignment-id
        in: path
        description: The unique identifier of appRoleAssignment
        required: true
        style: simple
        schema:
          type: string
        x-ms-docs-key-type: appRoleAssignment
      requestBody:
        description: New navigation property values
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/microsoft.graph.appRoleAssignment'
        required: true
      responses:
        2XX:
          description: Success
          content:
            application/json:
