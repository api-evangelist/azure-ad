      summary: Get appRoleAssignments from groups
      description: Represents the app roles granted to a group for an application. Supports $expand.
      operationId: group_GetAppRoleAssignment
      parameters:
      - name: group-id
        in: path
        description: The unique identifier of group
        required: true
        style: simple
