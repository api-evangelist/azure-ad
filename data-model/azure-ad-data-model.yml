identifiers:
  scheme: GUID
  note: >-
    Directory object ids are opaque GUIDs with no type prefix — a user id and a
    group id are indistinguishable by inspection, unlike prefix-encoded ids on
    many APIs. Type is carried by @odata.type on polymorphic collections. The
    canonical alternate key on users is userPrincipalName; on groups,
    mailNickname; on applications, appId (distinct from the object id — a
    long-standing source of integration bugs).
inheritance:
  root: microsoft.graph.entity
  base: microsoft.graph.directoryObject
  note: >-
    directoryObject inherits from entity and is itself the base for user, group,
    application, servicePrincipal, device, directoryRole, administrativeUnit,
    organization and appRoleAssignment. Membership and ownership collections are
    typed directoryObject and are POLYMORPHIC — /groups/{id}/members returns
    users, groups, devices and service principals in one collection, so a client
    must switch on @odata.type rather than assume users.
